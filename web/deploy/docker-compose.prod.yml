name: wechatsend

x-backend: &backend
  image: wechatsend-backend:latest
  build:
    context: ../..
    dockerfile: web/backend/Dockerfile
  env_file:
    - ${ENV_FILE:-../../.env}
  environment:
    NODE_ENV: production
    REDIS_URL: ${REDIS_URL:?请在.env中配置已有Redis的连接地址}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - wechatsend

services:
  migrate:
    <<: *backend
    profiles: ["tools"]
    restart: "no"
    command: ["npm", "run", "db:deploy"]

  api:
    <<: *backend
    restart: unless-stopped
    command: ["node", "web/backend/dist/src/main.js"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3100/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    <<: *backend
    restart: unless-stopped
    command: ["node", "web/backend/dist/src/worker.js"]

  web:
    image: wechatsend-web:latest
    build:
      context: ../..
      dockerfile: web/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - wechatsend

networks:
  wechatsend:
